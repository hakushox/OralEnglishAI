<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakNatural</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">

  <nav class="nav">
    <button data-view="practice" class="on">练习</button>
    <button data-view="word">单词</button>
    <button data-view="parse">长难句</button>
    <button data-view="chat">随便问</button>
    <button data-view="archive" class="spacer">档案 <span id="arc-count">—</span></button>
  </nav>

  <!-- ==================== 练习 ====================
       递进式：data-stage 控制阶段，交互项靠"浮现"而不是常驻按钮。
       .field 是通用的「输入框 + 内嵌麦克风」组件，别的模块也用它。 -->
  <section class="view on" id="v-practice">
    <div class="stage" id="p-stage" data-stage="1">

      <!-- ① 输入 -->
      <div class="st1">
        <div class="field">
          <textarea id="p-input" rows="3" placeholder="写一句英文，或者点右下角的麦克风说"></textarea>
          <button class="mic-btn" data-mic="#p-input" aria-label="语音输入">🎙</button>
          <div class="wave" data-wave></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="pill acc" id="p-go">改一改</button>
          <span class="hint">⌘ + Enter 提交</span>
        </div>
      </div>

      <!-- ②③④ 句子区（进入解析后缩小退场当上下文） -->
      <div class="st2up sent">
        <div class="label">你说的</div>
        <div class="line">
          <span class="draft en" id="p-draft"></span>
          <button class="ico" id="p-play-draft" aria-label="朗读原句">🔊</button>
        </div>
        <div class="label acc">地道版</div>
        <div class="line">
          <span class="revised en" id="p-revised"></span>
          <button class="ico" id="p-play-rev" aria-label="朗读地道版">🔊</button>
        </div>
      </div>

      <!-- ② 下一步是邀请；存档是并列的次要动作，有标签、位置固定 -->
      <div class="st2 row">
        <button class="invite" id="p-why">想知道为什么这么改<span class="chev">⌄</span></button>
        <button class="pill" id="p-save" style="margin-left:auto">存进档案</button>
      </div>

      <!-- ③④ 解析线索：每轮一条，旧的折叠成一行，随时能翻回去 -->
      <div class="st3 thread" id="p-thread"></div>

      <!-- ④ 追问 + 换一句 -->
      <div class="st4 slide-up" style="margin-top:16px">
        <div class="inrow">
          <div class="field single">
            <input type="text" id="p-why-input" placeholder="还有什么不解？">
            <button class="mic-btn" data-mic="#p-why-input" aria-label="语音输入">🎙</button>
            <div class="wave" data-wave></div>
          </div>
          <button class="pill acc" id="p-why-send">追问</button>
        </div>
        <!-- 保存整段讨论：固定在线索末尾，不再是每轮角上一个小图标 -->
        <div class="row" style="margin-top:14px">
          <button class="pill acc big" id="p-save-note">总结这段讨论，存进记录</button>
          <button class="invite subtle" id="p-again" style="margin-left:auto">换一句继续练<span class="chev">⌄</span></button>
        </div>
      </div>

      <div class="row" style="margin-top:6px;justify-content:space-between">
        <span class="hint" id="p-msg"></span>
        <span class="hint" id="p-src"></span>
      </div>

    </div>
  </section>

  <!-- ==================== 单词 ==================== -->
  <section class="view" id="v-word">
    <div class="inrow" style="margin-bottom:24px">
      <div class="field single">
        <input type="text" id="w-add" placeholder="输入想查的单词">
        <button class="mic-btn" data-mic="#w-add" aria-label="语音输入">🎙</button>
        <div class="wave" data-wave></div>
      </div>
      <button class="pill acc" id="w-go">查询</button>
    </div>
    <div class="two-col">
      <div>
        <div class="label">生词本</div>
        <div class="wlist" id="w-list"></div>
      </div>
      <div id="w-detail"></div>
    </div>
  </section>

  <!-- ==================== 长难句 ==================== -->
  <section class="view" id="v-parse">
    <div id="s-result" style="display:none">
      <div class="en" id="s-sentence" style="font-size:18px;line-height:1.7;margin-bottom:8px"></div>
      <div class="muted" id="s-tags" style="margin-bottom:18px"></div>
      <div class="card" id="s-analysis" style="font-size:14px;line-height:1.75;color:var(--text-2)"></div>
      <div id="s-thread"></div>
      <div class="inrow" style="margin:14px 0 12px">
        <div class="field single">
          <input type="text" id="s-more" placeholder="还有什么不解？">
          <button class="mic-btn" data-mic="#s-more" aria-label="语音输入">🎙</button>
          <div class="wave" data-wave></div>
        </div>
        <button class="pill acc" id="s-more-send">追问</button>
      </div>
      <div class="row">
        <button class="pill acc" id="s-save">存为笔记</button>
        <button class="pill" id="s-review">复习过往笔记</button>
      </div>
    </div>
    <div id="s-input-box">
      <div class="field">
        <textarea id="s-input" rows="3" placeholder="贴一句想拆解的长难句"></textarea>
        <button class="mic-btn" data-mic="#s-input" aria-label="语音输入">🎙</button>
        <div class="wave" data-wave></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="pill acc" id="s-go">分析结构</button>
      </div>
    </div>
  </section>

  <!-- ==================== 随便问 ==================== -->
  <section class="view" id="v-chat">
    <div class="row" style="justify-content:flex-end;margin-bottom:18px">
      <div class="seg" id="c-mode">
        <button data-mode="local" class="on">快速</button>
        <button data-mode="deep">深度</button>
      </div>
    </div>
    <div class="bubbles en" id="c-bubbles"></div>
    <div class="inrow">
      <div class="field single">
        <input type="text" id="c-input" placeholder="你想聊什么？">
        <button class="mic-btn" data-mic="#c-input" aria-label="语音输入">🎙</button>
        <div class="wave" data-wave></div>
      </div>
      <button class="pill acc" id="c-send">发送</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="pill" id="c-save">总结存档</button>
      <span class="hint">选中任意英文词可查词典</span>
    </div>
  </section>

  <!-- ==================== 档案 ==================== -->
  <section class="view" id="v-archive">
    <div class="row" style="margin-bottom:18px">
      <button class="pill acc" data-filter="all">全部</button>
      <button class="pill" data-filter="draft">造句</button>
      <button class="pill" data-filter="word">单词</button>
      <button class="pill" data-filter="parse">句型</button>
      <button class="pill" data-filter="chat">对话</button>
      <button class="pill ghost" id="a-analyze" style="margin-left:auto">分析我的语法习惯</button>
    </div>
    <div id="a-report"></div>
    <div id="a-list"></div>
  </section>

</div>
<script src="/static/app.js"></script>
</body>
</html>
