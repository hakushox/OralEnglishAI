<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakNatural</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">

  <nav class="nav">
    <button data-view="practice" class="on" data-tip="说或写一句英文，模型改成地道表达；可听发音、看为什么这么改、存进档案">练习</button>
    <button data-view="word" data-tip="查一个词的地道用法和例句，加进生词本，还能出题自测">单词</button>
    <button data-view="parse" data-tip="拆解复杂句子的结构，弄懂它为什么这么写，可存成复习笔记">长难句</button>
    <button data-view="chat" data-tip="英语相关的任何疑问。快速＝本地模型，深度＝云端模型">随便问</button>
    <button data-view="archive" class="spacer" data-tip="你积累的全部记录。可以让模型分析你反复出现的语法习惯">档案 <span id="arc-count">—</span></button>
  </nav>

  <!-- 环境提示条：语音模型在下载 / 没装 ollama。没话说时完全不占位置 -->
  <div id="sysbar"></div>

  <!-- ==================== 练习 ====================
       递进式：data-stage 控制阶段，交互项靠"浮现"而不是常驻按钮。
       .field 是通用的「输入框 + 内嵌麦克风」组件，别的模块也用它。 -->
  <section class="view on" id="v-practice">
    <div class="stage" id="p-stage" data-stage="1">

      <!-- ① 输入 -->
      <div class="st1">
        <div class="field">
          <textarea id="p-input" rows="3" placeholder="写一句英文，或者点右下角的麦克风说"></textarea>
          <button class="mic-btn" data-mic="#p-input" data-lang="en" aria-label="语音输入（说英文）" title="语音输入（说英文）">🎙</button>
          <div class="wave" data-wave></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="pill acc" id="p-go" data-tip="把你写的句子改成地道说法，并朗读一遍">改一改</button>
          <span class="hint">⌘ + Enter 提交</span>
        </div>
      </div>

      <!-- ②③④ 句子区（进入解析后缩小退场当上下文） -->
      <div class="st2up sent">
        <div class="label">你说的</div>
        <div class="line">
          <span class="draft en" id="p-draft"></span>
          <button class="ico" id="p-play-draft" aria-label="朗读原句">🔊</button>
        </div>
        <div class="label acc">地道版</div>
        <div class="line">
          <span class="revised en" id="p-revised"></span>
          <button class="ico" id="p-play-rev" aria-label="朗读地道版">🔊</button>
        </div>
      </div>

      <!-- ② 下一步是邀请；存档是并列的次要动作，有标签、位置固定 -->
      <div class="st2 row">
        <button class="invite" id="p-why" data-tip="让模型逐点讲清改动的原因，之后可以继续追问">想知道为什么这么改<span class="chev">⌄</span></button>
        <button class="pill" id="p-save" style="margin-left:auto">存进档案</button>
      </div>

      <!-- ③④ 解析线索：每轮一条，旧的折叠成一行，随时能翻回去 -->
      <div class="st3 thread" id="p-thread"></div>

      <!-- ④ 追问 + 换一句 -->
      <div class="st4 slide-up" style="margin-top:16px">
        <div class="inrow">
          <div class="field single">
            <input type="text" id="p-why-input" placeholder="还有什么不解？">
            <button class="mic-btn" data-mic="#p-why-input" data-lang="zh" aria-label="语音输入（说中文）" title="语音输入（说中文）">🎙</button>
            <div class="wave" data-wave></div>
          </div>
          <button class="pill acc" id="p-why-send">追问</button>
        </div>
        <!-- 保存整段讨论：固定在线索末尾，不再是每轮角上一个小图标 -->
        <div class="row" style="margin-top:14px">
          <button class="pill acc big" id="p-save-note" data-tip="把上面整段讨论压成一条笔记存进这条记录 —— 追问过几轮就总结，不是只留最后一条回复">总结这段讨论，存进记录</button>
        </div>
        <!-- 存完把实际存进去的内容显示出来，让用户能当场确认总结对不对 -->
        <div id="p-saved"></div>
      </div>

      <!-- 「换一句」从阶段②就要有：有些句子不需要深入问。
           以前它只在阶段④出现，不点「为什么这么改」就没有出路，是个死胡同。 -->
      <div class="st2up row" style="margin-top:14px">
        <button class="invite subtle restart" id="p-again" style="margin-left:auto" data-tip="清掉当前这一轮，回到输入框重新开始">换一句继续练<span class="chev">↻</span></button>
      </div>

      <!-- 次级板块：跟单词页的「我的生词本」同一套 .section 规范。
           对应终端版练习循环里的 /doc。 -->
      <div class="section" id="p-section">
        <button class="section-head" id="p-recent" data-tip="就地翻看你存过的练习记录，不用跳去档案页">
          <span class="section-title">最近的练习记录</span>
          <span class="section-count" id="p-count"></span>
          <span class="chev">⌄</span>
        </button>
        <div class="section-body">
          <div class="pager" id="p-pager" hidden>
            <button class="pager-nav" id="p-prev" aria-label="上一条">‹</button>
            <div class="cover" id="p-deck"></div>
            <button class="pager-nav" id="p-next-card" aria-label="下一条">›</button>
          </div>
          <div class="pager-foot" id="p-foot" hidden>
            <span class="deck-pos" id="p-pos"></span>
            <div class="dots" id="p-dots"></div>
            <span class="hint">点两侧卡片切换 · ‹ › 或 ← → 翻页</span>
          </div>
        </div>
      </div>

      <div class="row" style="margin-top:6px;justify-content:space-between">
        <span class="hint" id="p-msg"></span>
        <span class="hint" id="p-src"></span>
      </div>

    </div>
  </section>

  <!-- ==================== 单词 ====================
       层级：.hero（输入）+ 单词卡 = 主区；.section（生词本）= 次级板块。
       这套 .hero / .section 是给所有模块用的通用规范，别各写一套。 -->
  <section class="view" id="v-word">
    <div class="stage" id="w-stage" data-stage="1">

      <!-- 主区：输入 -->
      <div class="hero">
        <div class="hero-label">查一个词</div>
        <div class="inrow">
          <div class="field single">
            <input type="text" id="w-add" placeholder="输入单词或短语，回车查询">
            <button class="mic-btn" data-mic="#w-add" data-lang="en" aria-label="语音输入（说英文）" title="语音输入（说英文）">🎙</button>
            <div class="wave" data-wave></div>
          </div>
          <button class="pill acc hero-btn" id="w-go" data-tip="查这个词的音标、释义、搭配、用法提示和近义词辨析">查询</button>
        </div>
        <div class="st1 hint" style="margin-top:12px">查过的词可以存进生词本，之后能出题自测</div>
      </div>

      <!-- 主区：单词卡 -->
      <div class="st2up wcard">
        <div class="wcard-head">
          <span class="wcard-word en" id="w-word"></span>
          <button class="ico" id="w-play" aria-label="朗读这个词">🔊</button>
          <span class="stars" id="w-stars" title="地道/高级程度"></span>
          <span class="wcard-badge" id="w-badge"></span>
          <button class="pill ghost" id="w-cam">剑桥词典 ↗</button>
        </div>

        <div class="thread" id="w-thread"></div>

        <div class="w-ready">
          <div class="inrow" style="margin-top:14px">
            <div class="field single">
              <input type="text" id="w-more" placeholder="关于这个词还有什么不解？">
              <button class="mic-btn" data-mic="#w-more" data-lang="zh" aria-label="语音输入（说中文）" title="语音输入（说中文）">🎙</button>
              <div class="wave" data-wave></div>
            </div>
            <button class="pill acc" id="w-more-send" data-tip="基于上面的解析继续问，只答你问的这一点">追问</button>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="pill acc big" id="w-save-note">总结这个词，存进生词本</button>
            <button class="invite subtle" id="w-next" style="margin-left:auto">查下一个词<span class="chev">⌄</span></button>
          </div>
          <div id="w-saved"></div>
        </div>
        <div class="row" style="margin-top:8px"><span class="hint" id="w-msg"></span></div>
      </div>

      <!-- ③ 出题测一测。跟单词卡是互斥的：测验时整屏只做一件事 -->
      <div class="st3 quiz">
        <div class="quiz-head">
          <span class="quiz-word en" id="q-word"></span>
          <span class="quiz-pos" id="q-pos"></span>
          <button class="invite subtle restart" id="q-quit" style="margin-left:auto"
                  data-tip="退出测验，回到单词卡">退出测验<span class="chev">↻</span></button>
        </div>

        <div id="q-body">
          <div class="label" id="q-type"></div>
          <div class="card" id="q-explain" style="font-size:13px;color:var(--text-3)"></div>
          <div class="en" id="q-question" style="font-size:18px;line-height:1.7;margin:14px 0"></div>
          <div class="inrow">
            <div class="field single">
              <input type="text" id="q-answer" placeholder="写下你的答案，回车提交">
              <button class="mic-btn" data-mic="#q-answer" data-lang="en"
                      aria-label="语音输入（说英文）" title="语音输入（说英文）">🎙</button>
              <div class="wave" data-wave></div>
            </div>
            <button class="pill acc" id="q-submit" data-tip="提交这一题的答案">提交</button>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="pill ghost" id="q-skip" data-tip="跳过这题，记为未作答">跳过这题</button>
            <span class="hint" id="q-tries" style="margin-left:auto"></span>
          </div>
          <div id="q-feedback"></div>
        </div>

        <div id="q-result"></div>
      </div>

      <!-- 次级板块：生词本 -->
      <div class="section" id="w-section">
        <button class="section-head" id="w-book" data-tip="你存过的词，可以翻看、追问、删除">
          <span class="section-title">我的生词本</span>
          <span class="section-count" id="w-count"></span>
          <span class="chev">⌄</span>
        </button>
        <div class="section-body">
          <div class="pager" id="w-pager" hidden>
            <button class="pager-nav" id="w-prev" aria-label="上一个词">‹</button>
            <div class="cover" id="w-deck"></div>
            <button class="pager-nav" id="w-next-card" aria-label="下一个词">›</button>
          </div>
          <div class="pager-foot" id="w-foot" hidden>
            <span class="deck-pos" id="w-pos"></span>
            <div class="dots" id="w-dots"></div>
            <span class="hint">点两侧卡片切换 · ‹ › 或 ← → 翻页</span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ==================== 长难句 ====================
       套通用层级：.hero 输入 + 折叠线索 = 主区；.section 过往笔记 = 次级板块 -->
  <section class="view" id="v-parse">
    <div class="stage" id="s-stage" data-stage="1">

      <div class="hero">
        <div class="hero-label">拆一句长难句</div>
        <div class="inrow">
          <div class="field">
            <textarea id="s-input" rows="2" placeholder="贴一句想拆解的句子，⌘ + Enter 提交"></textarea>
            <button class="mic-btn" data-mic="#s-input" data-lang="en" aria-label="语音输入（说英文）" title="语音输入（说英文）">🎙</button>
            <div class="wave" data-wave></div>
          </div>
          <button class="pill acc hero-btn" id="s-go" data-tip="拆解句子结构：主干、从句、难点，必要时给同类句型举例">分析</button>
        </div>
        <div class="st1 hint" style="margin-top:12px">分析完可以追问，存成笔记后能回看、也能让模型找出你反复卡住的结构</div>
      </div>

      <div class="st2up">
        <div class="line" style="margin-bottom:10px">
          <span class="en" id="s-sentence" style="font-size:19px;line-height:1.65"></span>
          <button class="ico" id="s-play" aria-label="朗读这句">🔊</button>
        </div>
        <div class="thread" id="s-thread"></div>
        <div class="s-ready">
          <div class="inrow" style="margin-top:14px">
            <div class="field single">
              <input type="text" id="s-more" placeholder="还有什么不解？">
              <button class="mic-btn" data-mic="#s-more" data-lang="zh" aria-label="语音输入（说中文）" title="语音输入（说中文）">🎙</button>
              <div class="wave" data-wave></div>
            </div>
            <button class="pill acc" id="s-more-send" data-tip="基于上面的分析继续问">追问</button>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="pill acc big" id="s-save">总结成复习笔记</button>
            <button class="invite subtle restart" id="s-next" style="margin-left:auto" data-tip="清掉当前这一轮，回到输入框重新开始">换一句<span class="chev">↻</span></button>
          </div>
          <div id="s-saved"></div>
        </div>
        <div class="row" style="margin-top:8px"><span class="hint" id="s-msg"></span></div>
      </div>

      <div class="section" id="s-section">
        <button class="section-head" id="s-book" data-tip="你存过的句型笔记，可以翻看和删除">
          <span class="section-title">过往笔记</span>
          <span class="section-count" id="s-count"></span>
          <span class="chev">⌄</span>
        </button>
        <div class="section-body">
          <div class="row" style="margin-bottom:12px">
            <button class="pill" id="s-review" data-tip="把你过往的笔记放在一起，找出你反复卡住的那类结构">找出我反复卡住的结构</button>
          </div>
          <div id="s-report"></div>
          <div class="pager" id="s-pager" hidden>
            <button class="pager-nav" id="s-prev" aria-label="上一条">‹</button>
            <div class="cover" id="s-deck"></div>
            <button class="pager-nav" id="s-next-card" aria-label="下一条">›</button>
          </div>
          <div class="pager-foot" id="s-foot" hidden>
            <span class="deck-pos" id="s-pos"></span>
            <div class="dots" id="s-dots"></div>
            <span class="hint">点两侧卡片切换 · ‹ › 或 ← → 翻页</span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ==================== 随便问 ==================== -->
  <section class="view" id="v-chat">
    <div class="stage" id="c-stage" data-stage="1">

      <div class="hero">
        <div class="row" style="justify-content:space-between;margin-bottom:11px">
          <span class="hero-label" style="margin:0">问点什么</span>
          <div class="seg" id="c-mode">
            <button data-mode="local" class="on" data-tip="本地模型，答得快、不花额度，适合简单问题">快速</button>
            <button data-mode="deep" data-tip="云端大模型，讲得透，适合想彻底搞懂的问题">深度</button>
          </div>
        </div>
        <div class="inrow">
          <div class="field single">
            <input type="text" id="c-input" placeholder="英语相关的任何疑问，回车发送">
            <button class="mic-btn" data-mic="#c-input" data-lang="zh" aria-label="语音输入（说中文）" title="语音输入（说中文）">🎙</button>
            <div class="wave" data-wave></div>
          </div>
          <button class="pill acc hero-btn" id="c-send" data-tip="发送提问。快速档用本地模型，深度档用云端模型">发送</button>
        </div>
      </div>

      <div class="bubbles en" id="c-bubbles"></div>
      <div class="c-ready">
        <div class="row" style="margin-top:6px">
          <button class="pill acc big" id="c-save">总结这次对话，存进档案</button>
          <button class="invite subtle restart" id="c-clear" style="margin-left:auto" data-tip="清掉当前这一轮，回到输入框重新开始">清空重开<span class="chev">↻</span></button>
        </div>
        <div id="c-saved"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="hint" id="c-msg"></span>
        <span class="hint" style="margin-left:auto">选中任意英文词可查词典</span>
      </div>

      <div class="section" id="c-section">
        <button class="section-head" id="c-book" data-tip="你存过的对话总结，可以翻看和删除">
          <span class="section-title">过往对话总结</span>
          <span class="section-count" id="c-count"></span>
          <span class="chev">⌄</span>
        </button>
        <div class="section-body">
          <div class="pager" id="c-pager" hidden>
            <button class="pager-nav" id="c-prev" aria-label="上一条">‹</button>
            <div class="cover" id="c-deck"></div>
            <button class="pager-nav" id="c-next-card" aria-label="下一条">›</button>
          </div>
          <div class="pager-foot" id="c-foot" hidden>
            <span class="deck-pos" id="c-pos"></span>
            <div class="dots" id="c-dots"></div>
            <span class="hint">点两侧卡片切换 · ‹ › 或 ← → 翻页</span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ==================== 档案 ==================== -->
  <section class="view" id="v-archive">
    <div class="row" style="margin-bottom:18px">
      <button class="pill acc" data-filter="all">全部</button>
      <button class="pill" data-filter="draft">造句</button>
      <button class="pill" data-filter="word">单词</button>
      <button class="pill" data-filter="parse">句型</button>
      <button class="pill" data-filter="chat">对话</button>
      <button class="pill ghost" id="a-analyze" data-tip="读你最近 30 条造句，找出反复出现的句式和用词习惯" style="margin-left:auto">分析我的语法习惯</button>
    </div>
    <div id="a-report"></div>
    <div id="a-list"></div>
  </section>

  <div id="toast"></div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
